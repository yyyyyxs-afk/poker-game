<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>方案 E · 澳门豪华风</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --room: #120a0c;
  --lacquer-1: #241014; --lacquer-2: #170a0d;
  --gold: #d9b45b; --gold-hi: #f4df9a; --gold-dk: #8a6d2f;
  --felt-1: #6e1220; --felt-2: #4d0c17; --felt-3: #340810;
  --text: #f0e6d8; --muted: #b3a390;
  --cream: #fdfaf1;
  --red: #b3202e;
  --num: Georgia, "Times New Roman", serif;
}
body {
  font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
  background:
    radial-gradient(1300px 700px at 50% 26%, #3a1620 0%, transparent 58%),
    radial-gradient(600px 400px at 88% 92%, #2a0f16 0%, transparent 60%),
    var(--room);
  color: var(--text); height: 100vh; overflow: hidden;
  display: flex; flex-direction: column;
}

/* ── 顶栏：黑漆描金 ── */
#topbar {
  display: flex; align-items: center; gap: 16px; padding: 11px 22px; font-size: 13px;
  background: linear-gradient(180deg, var(--lacquer-1), var(--lacquer-2));
  border-bottom: 1px solid var(--gold-dk);
  box-shadow: 0 2px 12px rgba(0,0,0,.6);
}
.room { display: flex; align-items: baseline; gap: 10px; color: var(--muted); }
.room b { font-family: var(--num); font-size: 19px; letter-spacing: 4px; color: var(--gold-hi); }
.pill {
  border: 1px solid var(--gold-dk); background: rgba(217,180,91,.06); color: var(--muted);
  border-radius: 999px; font-size: 12px; padding: 4px 13px;
}
#hand-info { margin-left: auto; color: var(--muted); }
#hand-info b { color: var(--gold-hi); font-weight: 600; }

/* ── 舞台 ── */
#stage { flex: 1; display: flex; gap: 16px; padding: 16px 22px; min-height: 0; }
#table-zone { flex: 1; position: relative; min-width: 0; }
#table-zone::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(58% 52% at 50% 42%, rgba(255, 214, 150, .12), transparent 70%);
}

/* ── 牌桌：黑漆描金桌沿 + 酒红呢面 ── */
#table {
  position: absolute; inset: 5% 3%;
  border-radius: 999px;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0 1px, transparent 1px 5px),
    linear-gradient(160deg, var(--lacquer-1), #0e0608 70%);
  border: 4px solid transparent;
  box-shadow:
    0 0 0 2.5px var(--gold),
    0 0 0 3.5px #4d3c14,
    0 26px 80px rgba(0, 0, 0, .8),
    inset 0 2px 5px rgba(244, 223, 154, .12),
    inset 0 -6px 14px rgba(0,0,0,.6);
}
#felt {
  position: absolute; inset: 5%;
  border-radius: 999px;
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.014) 0 3px, transparent 3px 6px),
    radial-gradient(120% 130% at 50% 0%, var(--felt-1) 0%, var(--felt-2) 60%, var(--felt-3) 100%);
  box-shadow:
    inset 0 8px 34px rgba(0,0,0,.55),
    inset 0 -4px 20px rgba(0,0,0,.45),
    0 0 0 2px rgba(217, 180, 91, .4);
}
#felt::after {
  content: ""; position: absolute; inset: 13px; border-radius: 999px;
  border: 1.5px solid rgba(217, 180, 91, .3);
  background:
    radial-gradient(circle 5px at 50% 0%, rgba(217,180,91,.4), transparent 6px) top center / 30px 12px no-repeat,
    radial-gradient(circle 5px at 50% 100%, rgba(217,180,91,.4), transparent 6px) bottom center / 30px 12px no-repeat;
}
#brand {
  position: absolute; left: 50%; bottom: 10%; transform: translateX(-50%);
  color: rgba(244, 223, 154, .38); font-family: var(--num);
  font-size: 13px; letter-spacing: 7px; font-weight: 700;
}

/* ── 桌心 ── */
#center {
  position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center; gap: 15px; z-index: 3;
}
#pot { display: flex; align-items: center; gap: 12px; }
#pot .stack { display: flex; align-items: flex-end; }
.chip {
  width: 30px; height: 30px; border-radius: 50%; position: relative; flex: none;
  background: radial-gradient(circle at 50% 42%, rgba(0,0,0,.22) 0 27%, transparent 28%), var(--chipc, #b3202e);
  box-shadow: 0 2px 0 rgba(0,0,0,.45), 0 3px 5px rgba(0,0,0,.4);
  margin-left: -12px;
}
.chip::before {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background:
    conic-gradient(#f7efdc 0 14deg, transparent 14deg 68deg, #f7efdc 68deg 82deg, transparent 82deg 136deg,
    #f7efdc 136deg 150deg, transparent 150deg 204deg, #f7efdc 204deg 218deg, transparent 218deg 272deg,
    #f7efdc 272deg 286deg, transparent 286deg 340deg, #f7efdc 340deg 354deg, transparent 354deg);
  -webkit-mask: radial-gradient(circle, transparent 0 58%, #000 59% 100%);
  mask: radial-gradient(circle, transparent 0 58%, #000 59% 100%);
  opacity: .95;
}
.chip::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; border: 1px solid rgba(255,255,255,.38); }
.stacked { margin-bottom: 5px; }
#pot .c1 { --chipc: #b3202e; } #pot .c2 { --chipc: #8a6d2f; } #pot .c3 { --chipc: #1f4e79; }
#pot .label { font-size: 12px; color: #e3c3b0; letter-spacing: 2px; }
#pot .amt { font-family: var(--num); font-size: 27px; color: var(--gold-hi); font-weight: 700; letter-spacing: 1px; text-shadow: 0 2px 8px rgba(0,0,0,.7); }
#community { display: flex; gap: 11px; }

/* ── 扑克牌 ── */
.card {
  position: relative; width: 64px; height: 90px; flex: none;
  background: linear-gradient(160deg, #ffffff 0%, var(--cream) 100%);
  border-radius: 7px;
  box-shadow: 0 1px 0 rgba(255,255,255,.5) inset, 0 6px 14px rgba(0,0,0,.55);
  color: #23252d;
}
.card::before { content: ""; position: absolute; inset: 3px; border-radius: 5px; border: 1px solid rgba(179,32,46,.10); }
.card.red { color: var(--red); }
.card .idx { position: absolute; top: 6px; left: 7px; text-align: center; line-height: 1; font-family: var(--num); }
.card .idx b { display: block; font-size: 19px; font-weight: 700; }
.card .idx span { display: block; font-size: 13px; margin-top: 1px; }
.card .idx.flip { top: auto; left: auto; bottom: 6px; right: 7px; transform: rotate(180deg); }
.card .pip { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 34px; }
.card.back {
  background:
    radial-gradient(circle at 50% 50%, rgba(217,180,91,.85) 0 9%, transparent 10%),
    repeating-radial-gradient(circle at 50% 50%, #1d3a5c 0 4px, #24466e 4px 8px);
  border: 3.5px solid var(--cream);
  box-shadow: 0 6px 14px rgba(0,0,0,.55);
}
.card.back .idx, .card.back .pip { display: none; }

/* ── 座位 ── */
.seat { position: absolute; transform: translate(-50%, -50%); text-align: center; width: 160px; z-index: 4; }
.seat.me { bottom: -5%; }
.plate {
  margin-top: 7px; display: inline-block;
  background: linear-gradient(180deg, rgba(217,180,91,.10), rgba(0,0,0,.4)), linear-gradient(180deg, var(--lacquer-1), #0e0608);
  border: 1px solid var(--gold-dk); border-radius: 10px; padding: 5px 14px 6px;
  box-shadow: 0 4px 10px rgba(0,0,0,.55), inset 0 1px 0 rgba(244,223,154,.10);
}
.pname { font-size: 13px; font-weight: 600; }
.pchips { font-family: var(--num); font-size: 15px; color: var(--gold-hi); font-weight: 700; }
.ring {
  position: relative; width: 56px; height: 56px; margin: 0 auto; border-radius: 50%;
  background: linear-gradient(180deg, #2c141a, #150a0d);
  border: 3px solid var(--gold-dk);
  display: flex; align-items: center; justify-content: center; font-size: 28px;
  box-shadow: 0 5px 14px rgba(0,0,0,.6);
}
.seat.active .ring {
  border-color: var(--gold-hi);
  animation: glow 1.1s ease-in-out infinite alternate;
}
@keyframes glow {
  from { box-shadow: 0 0 0 3px rgba(244,223,154,.18), 0 5px 14px rgba(0,0,0,.6); }
  to { box-shadow: 0 0 0 9px rgba(244,223,154,.32), 0 5px 14px rgba(0,0,0,.6); }
}
.dbadge {
  position: absolute; right: 24px; top: -6px;
  width: 23px; height: 23px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fdf6d8, var(--gold) 72%);
  color: #4a3a08; font-size: 12px; font-weight: 800; line-height: 23px;
  box-shadow: 0 2px 5px rgba(0,0,0,.5); border: 1px solid var(--gold-dk);
}
.betstack {
  position: absolute; left: 50%; top: 100%; transform: translate(-50%, -120%);
  display: flex; align-items: center; gap: 7px; white-space: nowrap;
}
.betstack .mini { width: 22px; height: 22px; }
.betstack .mini::before { -webkit-mask: radial-gradient(circle, transparent 0 54%, #000 55%); mask: radial-gradient(circle, transparent 0 54%, #000 55%); }
.betstack .mini::after { inset: 5px; }
.betstack b { font-family: var(--num); font-size: 14px; color: var(--gold-hi); text-shadow: 0 1px 3px rgba(0,0,0,.8); }
.seat.me .betstack { display: none; }
.hole-opp { position: absolute; left: 50%; top: -16px; transform: translateX(-50%); display: flex; gap: 3px; }
.hole-opp .card { width: 27px; height: 38px; border-radius: 4px; }
.cards-hold { display: flex; gap: 6px; justify-content: center; margin-bottom: -22px; position: relative; z-index: 5; }
.cards-hold .card { width: 42px; height: 60px; }
.cards-hold .card .idx b { font-size: 13px; } .cards-hold .card .idx span { font-size: 9px; }
.cards-hold .card .pip { font-size: 21px; }
.seat.me .cards-hold .card { width: 54px; height: 76px; }
.seat.me .cards-hold .card .pip { font-size: 27px; }

/* ── 日志 ── */
#log {
  width: 245px; border-radius: 14px; padding: 15px; font-size: 12.5px;
  background: linear-gradient(180deg, var(--lacquer-1), #0e0608);
  border: 1px solid var(--gold-dk); color: var(--muted);
  box-shadow: 0 10px 30px rgba(0,0,0,.55);
  display: flex; flex-direction: column;
}
#log h3 { font-size: 12px; letter-spacing: 3px; color: var(--gold); margin-bottom: 11px; display: flex; justify-content: space-between; }
#log h3 span { color: #6d5f45; }
#log ul { list-style: none; }
#log li { padding: 5.5px 0; border-bottom: 1px dashed #3d2f16; }
#log li:last-child { color: var(--text); }
#log li b { color: var(--gold-hi); font-weight: 600; }

/* ── 操作栏 ── */
#actionbar {
  display: flex; align-items: center; gap: 14px; padding: 13px 22px 17px;
  background: linear-gradient(180deg, rgba(36,16,20,.85), rgba(14,6,8,.92));
  border-top: 1px solid var(--gold-dk);
  box-shadow: 0 -4px 20px rgba(0,0,0,.45);
}
#my-cards { display: flex; gap: 7px; }
#my-cards .card { width: 52px; height: 73px; }
#timer { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; }
#timer .bar { width: 120px; height: 5px; border-radius: 99px; background: rgba(0,0,0,.5); overflow: hidden; border: 1px solid var(--gold-dk); }
#timer .bar i { display: block; height: 100%; width: 71%; border-radius: 99px; background: linear-gradient(90deg, var(--gold), var(--gold-hi)); }
.acts { display: flex; gap: 12px; }
.act {
  border: 1px solid rgba(0,0,0,.4); cursor: pointer; color: #fdf8ec;
  padding: 13px 25px; border-radius: 9px;
  font-size: 15px; font-weight: 700; font-family: inherit;
  display: flex; align-items: baseline; gap: 8px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 4px 10px rgba(0,0,0,.45);
  transition: transform .08s;
}
.act:active { transform: translateY(2px); }
.act small { font-family: var(--num); font-size: 13px; opacity: .85; }
.a-fold { background: linear-gradient(180deg, #8c3040, #6e2231); }
.a-call { background: linear-gradient(180deg, #24557e, #173954); }
.a-raise { background: linear-gradient(180deg, #a8842e, #7c5f1c); border-color: rgba(217,180,91,.5); }
.a-allin { background: linear-gradient(180deg, #a3282b, #7c1a1d); box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 0 20px rgba(163,40,43,.5); }

.tag {
  position: fixed; right: 18px; top: 60px; z-index: 9;
  font-size: 12px; color: var(--gold-hi); letter-spacing: 2px;
  border: 1px solid var(--gold-dk); border-radius: 999px; padding: 4px 14px;
  background: rgba(14,6,8,.85);
}
</style>
</head>
<body>

<header id="topbar">
  <div class="room"><span>房号</span><b>7927</b><span class="pill">复制链接</span></div>
  <span class="pill">盲注 10/20</span>
  <span id="hand-info">第 <b>3</b> 局 · <b>翻牌</b></span>
  <span class="pill">♪ 音效</span>
  <span class="pill">退出房间</span>
</header>

<main id="stage">
  <div id="table-zone">
    <div id="table"><div id="felt"><div id="brand">MACAU STYLE</div></div></div>

    <div id="center">
      <div id="pot">
        <span class="stack">
          <i class="chip c1 stacked"></i><i class="chip c1 stacked"></i>
          <i class="chip c2 stacked"></i><i class="chip c2 stacked"></i>
          <i class="chip c3 stacked"></i><i class="chip c3"></i>
        </span>
        <span class="label">底池</span><span class="amt">2,040</span>
      </div>
      <div id="community">
        <div class="card"><span class="idx"><b>A</b><span>♠</span></span><span class="idx flip"><b>A</b><span>♠</span></span><span class="pip">♠</span></div>
        <div class="card red"><span class="idx"><b>K</b><span>♥</span></span><span class="idx flip"><b>K</b><span>♥</span></span><span class="pip">♥</span></div>
        <div class="card red"><span class="idx"><b>Q</b><span>♦</span></span><span class="idx flip"><b>Q</b><span>♦</span></span><span class="pip">♦</span></div>
      </div>
    </div>

    <div class="seat active" style="left:21%; top:9%;">
      <div class="hole-opp"><div class="card back"></div><div class="card back"></div></div>
      <div class="ring">🦊</div>
      <div class="plate"><div class="pname">小爱</div><div class="pchips">1,970</div></div>
      <div class="betstack"><i class="chip c1 mini"></i><b>20</b></div>
    </div>

    <div class="seat" style="left:79%; top:9%;">
      <div class="hole-opp"><div class="card back"></div><div class="card back"></div></div>
      <div class="ring">🐼</div>
      <div class="plate"><div class="pname">小酷</div><div class="pchips">5,980</div></div>
      <div class="dbadge">D</div>
    </div>

    <div class="seat" style="left:50%; top:1.5%;">
      <div class="hole-opp"><div class="card back"></div><div class="card back"></div></div>
      <div class="ring">🐯</div>
      <div class="plate"><div class="pname">小跳</div><div class="pchips">2,000</div></div>
    </div>

    <div class="seat me" style="left:50%; top:97%;">
      <div class="cards-hold">
        <div class="card red"><span class="idx"><b>A</b><span>♥</span></span><span class="idx flip"><b>A</b><span>♥</span></span><span class="pip">♥</span></div>
        <div class="card"><span class="idx"><b>J</b><span>♠</span></span><span class="idx flip"><b>J</b><span>♠</span></span><span class="pip">♠</span></div>
      </div>
      <div class="ring">🐯</div>
      <div class="plate"><div class="pname">ZCode（你）</div><div class="pchips">1,990</div></div>
    </div>
  </div>

  <aside id="log">
    <h3>牌局动态 <span>收起</span></h3>
    <ul>
      <li><b>小酷</b> 加注到 60</li>
      <li><b>小爱</b> 跟注 60</li>
      <li>翻牌：♠A ♥K ♦Q</li>
      <li><b>小跳</b> 过牌</li>
      <li><b>小酷</b> 下注 120</li>
      <li>轮到你行动</li>
    </ul>
  </aside>
</main>

<footer id="actionbar">
  <div id="my-cards">
    <div class="card red"><span class="idx"><b>A</b><span>♥</span></span><span class="idx flip"><b>A</b><span>♥</span></span><span class="pip">♥</span></div>
    <div class="card"><span class="idx"><b>J</b><span>♠</span></span><span class="idx flip"><b>J</b><span>♠</span></span><span class="pip">♠</span></div>
  </div>
  <div class="acts">
    <button class="act a-fold">弃牌</button>
    <button class="act a-call">跟注 <small>120</small></button>
    <button class="act a-raise">加注 ▾</button>
    <button class="act a-allin">全押 <small>1,990</small></button>
  </div>
  <div id="timer">思考时间 <span class="bar"><i></i></span> 32s</div>
</footer>

<div class="tag">方案 E · 澳门豪华风（黑漆描金+酒红呢面）</div>
</body>
</html>
