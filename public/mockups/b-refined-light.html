<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>方案 B · 精修浅色风</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #f4f2f8;
  --panel: #ffffff;
  --panel-2: #f6f4fb;
  --line: #e8e3f2;
  --text: #34304a;
  --muted: #837c9e;
  --accent: #7b5ff0;
  --accent-2: #9d85ff;
  --felt-1: #35786a;
  --felt-2: #265c50;
  --rail: #f7f4ec;
  --red: #e0484f;
  --blue: #4da3f5;
  --orange: #f5a623;
}
body {
  font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
  background:
    radial-gradient(1000px 500px at 12% -8%, #ffffff 0%, transparent 55%),
    radial-gradient(900px 600px at 108% 108%, #e9e2f7 0%, transparent 55%),
    var(--bg);
  color: var(--text);
  height: 100vh; overflow: hidden;
  display: flex; flex-direction: column;
}

/* ── 顶栏 ── */
#topbar {
  display: flex; align-items: center; gap: 16px;
  padding: 12px 22px; font-size: 13px;
  background: rgba(255, 255, 255, .8); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.room { display: flex; align-items: baseline; gap: 10px; color: var(--muted); }
.room b { font-size: 18px; letter-spacing: 4px; color: var(--accent); font-variant-numeric: tabular-nums; }
.pill {
  border: 1px solid var(--line); background: var(--panel);
  color: var(--muted); border-radius: 999px; font-size: 12px; padding: 5px 14px;
}
#hand-info { margin-left: auto; color: var(--muted); }
#hand-info b { color: var(--accent); }

/* ── 主区 ── */
#stage { flex: 1; display: flex; gap: 16px; padding: 18px 22px; min-height: 0; }
#table-zone { flex: 1; position: relative; min-width: 0; }

/* ── 牌桌：奶油包边 + 墨青呢面 + 缝线 ── */
#table {
  position: absolute; inset: 6% 4%;
  border-radius: 999px;
  background: radial-gradient(120% 130% at 50% 0%, var(--felt-1) 0%, var(--felt-2) 75%);
  border: 12px solid var(--rail);
  box-shadow:
    0 0 0 1px #e3ddcc,
    0 18px 50px rgba(53, 90, 80, .30),
    inset 0 0 0 2px rgba(255, 255, 255, .18),
    inset 0 10px 40px rgba(0, 0, 0, .28);
}
#table::after { /* 缝线 */
  content: ""; position: absolute; inset: 6px; border-radius: 999px;
  border: 2px dashed rgba(255, 255, 255, .28); pointer-events: none;
}
#brand {
  position: absolute; left: 50%; bottom: 11%; transform: translateX(-50%);
  color: rgba(255, 255, 255, .30); font-size: 12px; letter-spacing: 6px; font-weight: 600;
}

/* ── 桌心 ── */
#center {
  position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center; gap: 16px; z-index: 3;
}
#pot {
  display: flex; align-items: center; gap: 10px;
  background: rgba(255, 255, 255, .95); padding: 7px 22px; border-radius: 999px;
  box-shadow: 0 4px 14px rgba(38, 92, 80, .35);
}
#pot .coins { display: flex; }
#pot .coin {
  width: 17px; height: 17px; border-radius: 50%; margin-left: -7px;
  background: radial-gradient(circle at 35% 30%, #b9a4f7, #7b5ff0 75%);
  border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25);
}
#pot .coin:first-child { margin-left: 0; }
#pot .label { font-size: 12px; color: var(--muted); }
#pot .amt { font-size: 22px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
#community { display: flex; gap: 10px; }

/* ── 扑克牌 ── */
.card {
  position: relative; width: 62px; height: 88px;
  background: linear-gradient(150deg, #ffffff, #f7f5fb);
  border-radius: 10px;
  box-shadow: 0 5px 14px rgba(40, 35, 70, .18);
  color: #2a2740; flex: none;
}
.card.red { color: var(--red); }
.card .idx {
  position: absolute; top: 6px; left: 7px; text-align: center; line-height: 1;
  font-weight: 800;
}
.card .idx b { display: block; font-size: 17px; }
.card .idx span { display: block; font-size: 12px; margin-top: 1px; }
.card .idx.flip { top: auto; left: auto; bottom: 6px; right: 7px; transform: rotate(180deg); }
.card .pip { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 30px; }
.card.back {
  background:
    radial-gradient(circle at 50% 50%, rgba(123,95,240,.55) 0 14%, transparent 15%),
    repeating-linear-gradient(45deg, #b9a4f7 0 5px, #a892f2 5px 10px);
  border: 3px solid #fff; box-shadow: 0 5px 12px rgba(123, 95, 240, .35);
}
.card.back .idx, .card.back .pip { display: none; }

/* ── 座位 ── */
.seat { position: absolute; transform: translate(-50%, -50%); text-align: center; width: 150px; z-index: 4; }
.seat.me { bottom: -4%; }
.ring {
  position: relative; width: 58px; height: 58px; margin: 0 auto; border-radius: 50%;
  background: #fff; border: 3px solid #fff;
  display: flex; align-items: center; justify-content: center; font-size: 30px;
  box-shadow: 0 5px 14px rgba(123, 95, 240, .22);
}
.seat.active .ring {
  border-color: var(--accent-2);
  animation: breathe 1.2s ease-in-out infinite alternate;
}
@keyframes breathe {
  from { box-shadow: 0 0 0 3px rgba(123, 95, 240, .15), 0 5px 14px rgba(123,95,240,.22); }
  to { box-shadow: 0 0 0 8px rgba(123, 95, 240, .22), 0 5px 14px rgba(123,95,240,.22); }
}
.pname { margin-top: 6px; font-size: 13px; font-weight: 600; }
.pchips { font-size: 14px; color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
.ptotal { font-size: 11px; color: var(--muted); margin-top: 1px; }
.dbadge {
  position: absolute; right: 22px; top: -4px;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--accent); color: #fff;
  font-size: 12px; font-weight: 800; line-height: 22px;
  box-shadow: 0 2px 6px rgba(123, 95, 240, .4);
}
.betchip {
  position: absolute; left: 50%; top: 100%; transform: translate(-50%, -140%);
  display: flex; align-items: center; gap: 6px;
  background: #fff; border: 1px solid var(--line);
  padding: 3px 12px 3px 4px; border-radius: 999px; white-space: nowrap;
  box-shadow: 0 3px 8px rgba(123, 95, 240, .18);
}
.betchip .c {
  width: 16px; height: 16px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 35% 30%, #9d85ff, #7b5ff0 75%);
  border: 2px dashed rgba(255, 255, 255, .8);
}
.betchip b { font-size: 13px; color: var(--accent); font-variant-numeric: tabular-nums; }
.seat.me .betchip { display: none; }
.cards-hold { display: flex; gap: 5px; justify-content: center; margin-bottom: -20px; position: relative; z-index: 5; }
.cards-hold .card { width: 40px; height: 57px; }
.cards-hold .card .idx b { font-size: 12px; } .cards-hold .card .idx span { font-size: 9px; }
.cards-hold .card .pip { font-size: 20px; }
.seat.me .cards-hold .card { width: 52px; height: 74px; }
.seat.me .cards-hold .card .pip { font-size: 26px; }
.hole-opp { position: absolute; left: 50%; top: -14px; transform: translateX(-50%); display: flex; gap: 3px; }
.hole-opp .card { width: 26px; height: 37px; border-radius: 6px; border-width: 2px; }

/* ── 日志 ── */
#log {
  width: 240px; border-radius: 16px; padding: 16px;
  background: var(--panel); font-size: 12.5px;
  box-shadow: 0 8px 26px rgba(123, 95, 240, .10);
  display: flex; flex-direction: column;
}
#log h3 { font-size: 12px; color: var(--muted); letter-spacing: 2px; margin-bottom: 12px; display: flex; justify-content: space-between; }
#log h3 span { color: var(--accent); }
#log ul { list-style: none; }
#log li { padding: 6px 0; border-bottom: 1px dashed var(--line); color: var(--muted); }
#log li:last-child { color: var(--text); }
#log li b { color: var(--accent); font-weight: 600; }

/* ── 操作栏 ── */
#actionbar {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 22px 18px;
  background: rgba(255, 255, 255, .9); backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
}
#my-cards { display: flex; gap: 8px; margin-right: 6px; }
#my-cards .card { width: 50px; height: 71px; }
#timer { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; }
#timer .bar { width: 120px; height: 5px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
#timer .bar i { display: block; height: 100%; width: 72%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
.acts { display: flex; gap: 12px; margin-left: auto; }
.act {
  border: none; cursor: pointer; color: #fff;
  padding: 13px 26px; border-radius: 999px;
  font-size: 15px; font-weight: 700; font-family: inherit;
  display: flex; align-items: baseline; gap: 8px;
  transition: transform .08s;
}
.act:active { transform: scale(.96); }
.act small { font-size: 13px; opacity: .9; font-variant-numeric: tabular-nums; }
.a-fold { background: #fff; color: var(--red); box-shadow: inset 0 0 0 2px #f6c6cd; }
.a-call { background: var(--blue); box-shadow: 0 4px 14px rgba(77, 163, 245, .35); }
.a-raise { background: var(--accent); box-shadow: 0 4px 14px rgba(123, 95, 240, .35); }
.a-allin { background: linear-gradient(135deg, #f75d8a, #fb7f67); box-shadow: 0 4px 16px rgba(247, 93, 138, .4); }

/* 角标 */
.tag {
  position: fixed; right: 18px; top: 64px; z-index: 9;
  font-size: 12px; color: var(--accent); letter-spacing: 2px;
  border: 1px solid var(--accent-2); border-radius: 999px; padding: 4px 14px;
  background: rgba(255, 255, 255, .85);
}
</style>
</head>
<body>

<header id="topbar">
  <div class="room"><span>房号</span><b>7927</b><span class="pill">复制链接</span></div>
  <span class="pill">盲注 10/20</span>
  <span id="hand-info">第 <b>3</b> 局 · <b>翻牌</b></span>
  <span class="pill">♪ 音效</span>
  <span class="pill">退出房间</span>
</header>

<main id="stage">
  <div id="table-zone">
    <div id="table"><div id="brand">FRIENDLY HOLD'EM</div></div>

    <div id="center">
      <div id="pot">
        <span class="coins"><i class="coin"></i><i class="coin"></i><i class="coin"></i></span>
        <span class="label">底池</span><span class="amt">2,040</span>
      </div>
      <div id="community">
        <div class="card"><span class="idx"><b>A</b><span>♠</span></span><span class="idx flip"><b>A</b><span>♠</span></span><span class="pip">♠</span></div>
        <div class="card red"><span class="idx"><b>K</b><span>♥</span></span><span class="idx flip"><b>K</b><span>♥</span></span><span class="pip">♥</span></div>
        <div class="card red"><span class="idx"><b>Q</b><span>♦</span></span><span class="idx flip"><b>Q</b><span>♦</span></span><span class="pip">♦</span></div>
      </div>
    </div>

    <div class="seat active" style="left:22%; top:10%;">
      <div class="hole-opp"><div class="card back"></div><div class="card back"></div></div>
      <div class="ring">🦊</div>
      <div class="pname">小爱</div>
      <div class="pchips">1,970</div>
      <div class="betchip"><i class="c"></i><b>20</b></div>
    </div>

    <div class="seat" style="left:78%; top:10%;">
      <div class="hole-opp"><div class="card back"></div><div class="card back"></div></div>
      <div class="ring">🐼</div>
      <div class="pname">小酷</div>
      <div class="pchips">5,980</div>
      <div class="dbadge">D</div>
    </div>

    <div class="seat" style="left:50%; top:1%;">
      <div class="hole-opp"><div class="card back"></div><div class="card back"></div></div>
      <div class="ring">🐯</div>
      <div class="pname">小跳</div>
      <div class="pchips">2,000</div>
    </div>

    <div class="seat me" style="left:50%; top:96%;">
      <div class="cards-hold">
        <div class="card red"><span class="idx"><b>A</b><span>♥</span></span><span class="idx flip"><b>A</b><span>♥</span></span><span class="pip">♥</span></div>
        <div class="card"><span class="idx"><b>J</b><span>♠</span></span><span class="idx flip"><b>J</b><span>♠</span></span><span class="pip">♠</span></div>
      </div>
      <div class="ring">🐯</div>
      <div class="pname">ZCode（你）</div>
      <div class="pchips">1,990</div>
    </div>
  </div>

  <aside id="log">
    <h3>牌局动态 <span>收起</span></h3>
    <ul>
      <li><b>小酷</b> 加注到 60</li>
      <li><b>小爱</b> 跟注 60</li>
      <li>翻牌：♠A ♥K ♦Q</li>
      <li><b>小跳</b> 过牌</li>
      <li><b>小酷</b> 下注 120</li>
      <li>轮到你行动</li>
    </ul>
  </aside>
</main>

<footer id="actionbar">
  <div id="my-cards">
    <div class="card red"><span class="idx"><b>A</b><span>♥</span></span><span class="idx flip"><b>A</b><span>♥</span></span><span class="pip">♥</span></div>
    <div class="card"><span class="idx"><b>J</b><span>♠</span></span><span class="idx flip"><b>J</b><span>♠</span></span><span class="pip">♠</span></div>
  </div>
  <div class="acts">
    <button class="act a-fold">弃牌</button>
    <button class="act a-call">跟注 <small>120</small></button>
    <button class="act a-raise">加注 ▾</button>
    <button class="act a-allin">全押 <small>1,990</small></button>
  </div>
  <div id="timer">思考时间 <span class="bar"><i></i></span> 32s</div>
</footer>

<div class="tag">方案 B · 精修浅色风</div>
</body>
</html>
