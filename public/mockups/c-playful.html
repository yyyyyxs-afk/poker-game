<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>方案 C · 趣味卡通风</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg-1: #fff8ec;
  --bg-2: #e9f8ef;
  --panel: #ffffff;
  --text: #4a3f35;
  --muted: #9b8f80;
  --green: #3fae6a;
  --green-d: #2e8f54;
  --orange: #ff9f43;
  --pink: #ff6b8a;
  --blue: #54a9ff;
  --purple: #9b7bff;
  --yellow: #ffd166;
  --shadow: 0 10px 0 rgba(74, 63, 53, .08);
}
body {
  font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
  background:
    radial-gradient(500px 260px at 8% 12%, rgba(255, 209, 102, .25), transparent 60%),
    radial-gradient(560px 300px at 92% 90%, rgba(107, 203, 255, .22), transparent 60%),
    linear-gradient(160deg, var(--bg-1), var(--bg-2));
  color: var(--text);
  height: 100vh; overflow: hidden;
  display: flex; flex-direction: column;
}

/* ── 顶栏 ── */
#topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 22px; font-size: 13px;
}
.room {
  display: flex; align-items: center; gap: 10px;
  background: #fff; border-radius: 999px; padding: 6px 18px;
  box-shadow: var(--shadow); font-weight: 700;
}
.room b { font-size: 18px; letter-spacing: 3px; color: var(--green-d); }
.pill {
  background: #fff; border-radius: 999px; padding: 6px 14px;
  box-shadow: var(--shadow); color: var(--muted); font-size: 12px; font-weight: 600;
}
#hand-info { margin-left: auto; background: var(--yellow); color: #7a5c00; border-radius: 999px; padding: 6px 16px; font-weight: 700; box-shadow: var(--shadow); }

/* ── 主区 ── */
#stage { flex: 1; display: flex; gap: 16px; padding: 14px 22px 0; min-height: 0; }
#table-zone { flex: 1; position: relative; min-width: 0; }

/* ── 牌桌：粗白圆角包边 + 亮绿呢面 ── */
#table {
  position: absolute; inset: 7% 5%;
  border-radius: 999px;
  background: radial-gradient(120% 140% at 50% 8%, #52c47c 0%, var(--green) 55%, var(--green-d) 100%);
  border: 12px solid #ffffff;
  box-shadow:
    0 0 0 3px #ffe3a3,
    0 20px 44px rgba(63, 174, 106, .35),
    inset 0 0 0 4px rgba(255, 255, 255, .25),
    inset 0 12px 30px rgba(0, 0, 0, .18);
}
#table::after { /* 桌面装饰点 */
  content: ""; position: absolute; inset: 10px; border-radius: 999px;
  background-image: radial-gradient(rgba(255,255,255,.20) 2.5px, transparent 3px);
  background-size: 34px 34px;
  pointer-events: none; opacity: .5;
}
#brand {
  position: absolute; left: 50%; bottom: 10%; transform: translateX(-50%);
  color: rgba(255, 255, 255, .55); font-size: 13px; letter-spacing: 4px; font-weight: 800;
}

/* ── 桌心 ── */
#center {
  position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center; gap: 16px; z-index: 3;
}
#pot {
  display: flex; align-items: center; gap: 10px;
  background: #fff; padding: 8px 24px; border-radius: 999px;
  box-shadow: var(--shadow);
}
#pot .coins { display: flex; }
#pot .coin {
  width: 20px; height: 20px; border-radius: 50%; margin-left: -8px;
  background: radial-gradient(circle at 35% 30%, #ffd166, #f4a825 75%);
  border: 2.5px dashed rgba(255, 255, 255, .9);
  box-shadow: 0 2px 4px rgba(0,0,0,.15);
}
#pot .coin:first-child { margin-left: 0; }
#pot .label { font-size: 13px; color: var(--muted); font-weight: 700; }
#pot .amt { font-size: 24px; font-weight: 900; color: var(--green-d); }
#community { display: flex; gap: 10px; }

/* ── 扑克牌（大圆角 + 微旋转）── */
.card {
  position: relative; width: 64px; height: 90px;
  background: #fffdf8;
  border-radius: 14px;
  border: 3px solid #fff;
  box-shadow: 0 8px 0 rgba(74, 63, 53, .12), 0 12px 24px rgba(74, 63, 53, .14);
  color: #4a3f35; flex: none;
  transform: rotate(-2deg);
}
.card:nth-child(2) { transform: rotate(1.5deg); }
.card:nth-child(3) { transform: rotate(-1deg); }
.card.red { color: var(--pink); }
.card .idx { position: absolute; top: 6px; left: 8px; text-align: center; line-height: 1; font-weight: 900; }
.card .idx b { display: block; font-size: 18px; }
.card .idx span { display: block; font-size: 13px; margin-top: 1px; }
.card .idx.flip { top: auto; left: auto; bottom: 6px; right: 8px; transform: rotate(180deg); }
.card .pip { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 32px; }
.card.back {
  background:
    radial-gradient(circle at 50% 45%, #ffd166 0 18%, transparent 19%),
    repeating-linear-gradient(-45deg, #6bcbff 0 8px, #54a9ff 8px 16px);
  border-color: #fff;
}
.card.back .idx, .card.back .pip { display: none; }

/* ── 座位 ── */
.seat { position: absolute; transform: translate(-50%, -50%); text-align: center; width: 150px; z-index: 4; }
.seat.me { bottom: -4%; }
.ring {
  position: relative; width: 60px; height: 60px; margin: 0 auto; border-radius: 50%;
  background: #fff; border: 3px solid #fff;
  display: flex; align-items: center; justify-content: center; font-size: 32px;
  box-shadow: var(--shadow);
}
.seat.active .ring { border-color: var(--yellow); animation: wiggle 1s ease-in-out infinite; }
@keyframes wiggle {
  0%, 100% { transform: rotate(-3deg) scale(1); }
  50% { transform: rotate(3deg) scale(1.06); }
}
.nametag {
  display: inline-block; margin-top: 8px;
  background: #fff; border-radius: 999px; padding: 3px 14px;
  font-size: 13px; font-weight: 800; box-shadow: var(--shadow);
}
.pchips { margin-top: 3px; font-size: 14px; color: var(--green-d); font-weight: 900; }
.ptotal { font-size: 11px; color: var(--muted); margin-top: 1px; }
.dbadge {
  position: absolute; right: 24px; top: -6px;
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--yellow); color: #7a5c00;
  font-size: 12px; font-weight: 900; line-height: 24px;
  border: 2.5px dashed #fff; box-shadow: 0 2px 0 rgba(74,63,53,.15);
}
.betchip {
  position: absolute; left: 50%; top: 100%; transform: translate(-50%, -135%);
  display: flex; align-items: center; gap: 6px;
  background: #fff; padding: 3px 12px 3px 4px; border-radius: 999px;
  box-shadow: var(--shadow); white-space: nowrap;
}
.betchip .c {
  width: 17px; height: 17px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 35% 30%, #ff8fa8, var(--pink) 75%);
  border: 2.5px dashed rgba(255, 255, 255, .95);
}
.betchip b { font-size: 13px; color: var(--pink); font-weight: 900; }
.seat.me .betchip { display: none; }
.cards-hold { display: flex; gap: 5px; justify-content: center; margin-bottom: -20px; position: relative; z-index: 5; }
.cards-hold .card { width: 42px; height: 59px; border-radius: 11px; border-width: 2.5px; }
.cards-hold .card .idx b { font-size: 12px; } .cards-hold .card .idx span { font-size: 9px; }
.cards-hold .card .pip { font-size: 20px; }
.seat.me .cards-hold .card { width: 54px; height: 76px; }
.seat.me .cards-hold .card .pip { font-size: 27px; }
.hole-opp { position: absolute; left: 50%; top: -14px; transform: translateX(-50%); display: flex; gap: 3px; }
.hole-opp .card { width: 27px; height: 38px; border-radius: 8px; border-width: 2px; }

/* ── 日志（便签风）── */
#log {
  width: 240px; border-radius: 20px; padding: 16px;
  background: #fffdf4; font-size: 12.5px;
  box-shadow: var(--shadow);
  border: 2px solid #ffefc2;
  display: flex; flex-direction: column;
}
#log h3 { font-size: 13px; color: #b58a1e; margin-bottom: 12px; display: flex; justify-content: space-between; font-weight: 900; }
#log h3 span { color: var(--muted); font-size: 11px; }
#log ul { list-style: none; }
#log li { padding: 6px 0; border-bottom: 2px dashed #ffefc2; color: var(--muted); }
#log li:last-child { color: var(--text); }
#log li b { color: var(--green-d); font-weight: 800; }

/* ── 操作栏 ── */
#actionbar {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 22px 20px;
}
#my-cards { display: flex; gap: 8px; margin-right: 6px; }
#my-cards .card { width: 52px; height: 73px; }
#timer { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; font-weight: 700; }
#timer .bar { width: 120px; height: 8px; border-radius: 99px; background: #fff; box-shadow: inset 0 2px 4px rgba(74,63,53,.12); overflow: hidden; }
#timer .bar i { display: block; height: 100%; width: 72%; border-radius: 99px; background: linear-gradient(90deg, var(--yellow), var(--orange)); }
.acts { display: flex; gap: 12px; margin-left: auto; }
.act {
  border: none; cursor: pointer; color: #fff;
  padding: 13px 24px; border-radius: 20px;
  font-size: 15px; font-weight: 900; font-family: inherit;
  display: flex; align-items: baseline; gap: 8px;
  transition: transform .08s;
  box-shadow: 0 5px 0 rgba(74, 63, 53, .18);
}
.act:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(74,63,53,.18); }
.act small { font-size: 13px; opacity: .95; }
.a-fold { background: var(--pink); }
.a-call { background: var(--blue); }
.a-raise { background: var(--purple); }
.a-allin { background: linear-gradient(135deg, #ff6b8a, #ff9f43); }

/* 角标 */
.tag {
  position: fixed; right: 18px; top: 70px; z-index: 9;
  font-size: 12px; color: #b58a1e; letter-spacing: 2px; font-weight: 800;
  border-radius: 999px; padding: 5px 14px;
  background: #fff; box-shadow: var(--shadow);
}
</style>
</head>
<body>

<header id="topbar">
  <div class="room">房号 <b>7927</b> 🔗</div>
  <span class="pill">盲注 10/20</span>
  <span class="pill">♪ 音效</span>
  <span class="pill">退出房间</span>
  <span id="hand-info">第 3 局 · 翻牌圈</span>
</header>

<main id="stage">
  <div id="table-zone">
    <div id="table"><div id="brand">🎉 FRIENDLY HOLD'EM 🎉</div></div>

    <div id="center">
      <div id="pot">
        <span class="coins"><i class="coin"></i><i class="coin"></i><i class="coin"></i></span>
        <span class="label">底池</span><span class="amt">2,040</span>
      </div>
      <div id="community">
        <div class="card"><span class="idx"><b>A</b><span>♠</span></span><span class="idx flip"><b>A</b><span>♠</span></span><span class="pip">♠</span></div>
        <div class="card red"><span class="idx"><b>K</b><span>♥</span></span><span class="idx flip"><b>K</b><span>♥</span></span><span class="pip">♥</span></div>
        <div class="card red"><span class="idx"><b>Q</b><span>♦</span></span><span class="idx flip"><b>Q</b><span>♦</span></span><span class="pip">♦</span></div>
      </div>
    </div>

    <div class="seat active" style="left:22%; top:10%;">
      <div class="hole-opp"><div class="card back"></div><div class="card back"></div></div>
      <div class="ring">🦊</div>
      <div class="nametag">小爱</div>
      <div class="pchips">1,970</div>
      <div class="betchip"><i class="c"></i><b>20</b></div>
    </div>

    <div class="seat" style="left:78%; top:10%;">
      <div class="hole-opp"><div class="card back"></div><div class="card back"></div></div>
      <div class="ring">🐼</div>
      <div class="nametag">小酷</div>
      <div class="pchips">5,980</div>
      <div class="dbadge">D</div>
    </div>

    <div class="seat" style="left:50%; top:1%;">
      <div class="hole-opp"><div class="card back"></div><div class="card back"></div></div>
      <div class="ring">🐯</div>
      <div class="nametag">小跳</div>
      <div class="pchips">2,000</div>
    </div>

    <div class="seat me" style="left:50%; top:96%;">
      <div class="cards-hold">
        <div class="card red"><span class="idx"><b>A</b><span>♥</span></span><span class="idx flip"><b>A</b><span>♥</span></span><span class="pip">♥</span></div>
        <div class="card"><span class="idx"><b>J</b><span>♠</span></span><span class="idx flip"><b>J</b><span>♠</span></span><span class="pip">♠</span></div>
      </div>
      <div class="ring">🐯</div>
      <div class="nametag">ZCode（你）</div>
      <div class="pchips">1,990</div>
    </div>
  </div>

  <aside id="log">
    <h3>📜 牌局动态 <span>收起</span></h3>
    <ul>
      <li><b>小酷</b> 加注到 60</li>
      <li><b>小爱</b> 跟注 60</li>
      <li>翻牌：♠A ♥K ♦Q</li>
      <li><b>小跳</b> 过牌</li>
      <li><b>小酷</b> 下注 120</li>
      <li>轮到你行动啦！</li>
    </ul>
  </aside>
</main>

<footer id="actionbar">
  <div id="my-cards">
    <div class="card red"><span class="idx"><b>A</b><span>♥</span></span><span class="idx flip"><b>A</b><span>♥</span></span><span class="pip">♥</span></div>
    <div class="card"><span class="idx"><b>J</b><span>♠</span></span><span class="idx flip"><b>J</b><span>♠</span></span><span class="pip">♠</span></div>
  </div>
  <div class="acts">
    <button class="act a-fold">💪 弃牌</button>
    <button class="act a-call">👀 跟注 <small>120</small></button>
    <button class="act a-raise">🚀 加注</button>
    <button class="act a-allin">🔥 全押</button>
  </div>
  <div id="timer">思考时间 <span class="bar"><i></i></span> 32s</div>
</footer>

<div class="tag">方案 C · 趣味卡通风</div>
</body>
</html>
