<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>德州扑克 · 好友局</title>
  <link rel="stylesheet" href="a1-foundation.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 大厅（A1：私人好友局入口，§19） -->
  <div id="lobby" class="screen">
    <div class="lobby-card">
      <h1>Poker Game</h1>
      <p class="lobby-tag">好友局的线上牌桌 · 无限注德州扑克</p>
      <p class="subtitle">盲注 10/20 · 起始筹码 2000 · 2-6 人</p>
      <label>你的昵称
        <input id="nickname" type="text" maxlength="8" placeholder="昵称（每人不同）" />
      </label>
      <button id="btn-create" class="btn btn-primary">创建房间</button>
      <div class="divider">或加入好友房间</div>
      <div class="join-row">
        <input id="room-code" type="text" maxlength="6" placeholder="6 位邀请码"
               autocapitalize="characters" autocomplete="off" spellcheck="false" />
        <button id="btn-join" class="btn btn-secondary">加入</button>
      </div>
      <div id="lobby-error" class="error"></div>
    </div>
  </div>

  <!-- 牌局：Game Shell → Header → Play Layout（Play Stage + Log Panel） -->
  <div id="game" class="screen hidden">
    <header id="topbar">
      <div class="topbar-group topbar-left">
        <div class="menu-wrap">
          <button id="btn-menu" class="icon-btn" aria-label="打开菜单" aria-haspopup="true" aria-expanded="false">
            <img src="assets/a1/icons/text-indent-left.svg" alt="" />
          </button>
          <div id="menu-dropdown" class="hidden" role="menu">
            <button id="btn-copy-code" role="menuitem">复制房号</button>
            <button id="btn-copy-link" role="menuitem">复制邀请链接</button>
            <button id="btn-sit-out" role="menuitem">暂离（不参与下局）</button>
            <button id="btn-leave" class="menu-danger" role="menuitem">退出房间</button>
          </div>
        </div>
        <span class="room-meta">房间号 <b id="room-code-display"></b></span>
        <span class="topbar-sep" aria-hidden="true"></span>
        <span class="blinds" id="blinds-info">盲注 10/20</span>
        <span id="hand-info"></span>
      </div>
      <div class="topbar-group topbar-right">
        <button id="btn-sound" class="icon-btn" aria-label="音效">
          <img class="icon-on" src="assets/a1/icons/volume-up.svg" alt="" />
          <img class="icon-off" src="assets/a1/icons/volume-mute.svg" alt="" />
        </button>
        <button id="btn-settings" class="icon-btn hidden" aria-label="房管设置">
          <img src="assets/a1/icons/gear.svg" alt="" />
        </button>
        <button id="btn-log-toggle" class="icon-btn" aria-label="牌局记录" aria-pressed="true">
          <img src="assets/a1/icons/journal-text.svg" alt="" />
        </button>
      </div>
    </header>

    <main id="play-layout">
      <section id="play-stage">
        <div id="table">
          <div id="table-ring" aria-hidden="true"></div>
          <div id="table-inner">
            <div id="winner-banner" class="hidden" aria-live="polite"></div>
            <div id="stage-label"></div>
            <div id="pot-display"><span class="pot-label">底池</span><b id="pot-value">0</b></div>
            <div id="community"></div>
          </div>
          <!-- 下注筹码层：席位与桌心之间 -->
          <div id="bets" aria-hidden="true"></div>
          <!-- 对手席位由 JS 渲染 -->
          <div id="seats"></div>
        </div>

        <!-- Hero 一体化：席位 + 手牌 + 倒计时 + 操作区，同一结构锚点 -->
        <div id="hero-dock">
          <div id="hero-row">
            <div id="hero-seat"></div>
            <div id="my-cards" class="hidden"></div>
            <div id="turn-timer" class="hidden"></div>
          </div>
          <div id="action-hint" class="hidden" aria-live="polite"></div>
          <div id="action-bar" class="hidden">
            <div id="raise-scrim" aria-hidden="true"></div>
            <div id="raise-panel" class="hidden">
              <div class="raise-head">
                <span class="raise-label" id="raise-label">加注到</span>
                <input id="raise-input" type="number" step="10" inputmode="numeric" aria-label="加注金额" />
              </div>
              <div class="raise-presets" role="group" aria-label="快捷加注">
                <button class="btn preset" data-preset="third">1/3池</button>
                <button class="btn preset" data-preset="half">1/2池</button>
                <button class="btn preset" data-preset="twothird">2/3池</button>
                <button class="btn preset" data-preset="pot">满池</button>
                <button class="btn preset" data-preset="allin">全押</button>
              </div>
              <div class="raise-slider-row">
                <button id="raise-dec" class="step-btn" aria-label="减少加注额">−</button>
                <input id="raise-slider" type="range" min="0" max="0" step="10" value="0" aria-label="加注额" />
                <button id="raise-inc" class="step-btn" aria-label="增加加注额">＋</button>
              </div>
              <div class="raise-range"><span id="raise-min-label"></span><span id="raise-max-label"></span></div>
              <div class="raise-actions">
                <button id="btn-raise-cancel" class="btn btn-ghost">取消</button>
                <button id="btn-raise-confirm" class="btn btn-raise">确认加注 <span id="raise-confirm-value">0</span></button>
              </div>
            </div>
            <div id="action-buttons">
              <button id="btn-fold" class="btn btn-danger">弃牌</button>
              <button id="btn-check-call" class="btn btn-call">过牌</button>
              <button id="btn-toggle-raise" class="btn btn-raise">加注</button>
              <button id="btn-allin" class="btn btn-allin">全押</button>
            </div>
          </div>
          <div class="footer-buttons">
            <button id="btn-invite" class="btn btn-secondary hidden">邀请好友</button>
            <button id="btn-start" class="btn btn-primary hidden">开始游戏</button>
            <button id="btn-rebuy" class="btn btn-warning hidden">重新买入（补充 2000 筹码）</button>
            <button id="btn-sit-back" class="btn btn-primary hidden">坐回</button>
            <button id="btn-result-detail" class="btn btn-secondary hidden">查看本局详情</button>
            <div id="emoji-wrap" class="emoji-wrap">
              <button id="emoji-toggle" class="icon-btn hidden" aria-label="表情互动" aria-haspopup="true"
                      aria-controls="emoji-bar" aria-expanded="false">
                <img src="assets/a1/icons/emoji-smile.svg" alt="" />
              </button>
              <div id="emoji-bar" class="hidden" role="group" aria-label="选择表情"></div>
            </div>
          </div>
          <div id="waiting-tip"></div>
        </div>
      </section>

      <aside id="log-panel">
        <div class="log-head">
          <h3>牌局记录</h3>
          <button id="btn-log-collapse" class="icon-btn small" aria-label="收起牌局记录">
            <img src="assets/a1/icons/chevron-right.svg" alt="" />
          </button>
        </div>
        <ul id="log-list"></ul>
      </aside>
    </main>

    <!-- 房管设置弹窗 -->
    <div id="settings-overlay" class="overlay hidden">
      <div id="settings-card">
        <h2>房管设置</h2>
        <label>每人起始筹码
          <input id="set-start-chips" type="number" min="100" max="1000000" step="100" />
        </label>
        <div class="settings-row">
          <label>小盲注
            <input id="set-sb" type="number" min="1" step="5" />
          </label>
          <label>大盲注
            <input id="set-bb" type="number" min="1" step="5" />
          </label>
        </div>
        <div class="settings-row">
          <label>行动时长
            <select id="set-action-time">
              <option value="20">20 秒</option>
              <option value="30">30 秒</option>
              <option value="45" selected>45 秒</option>
              <option value="60">60 秒</option>
            </select>
          </label>
          <label>局间倒计时
            <select id="set-next-hand">
              <option value="5">5 秒</option>
              <option value="10">10 秒</option>
              <option value="20" selected>20 秒</option>
            </select>
          </label>
        </div>
        <label>允许重买
          <select id="set-rebuy">
            <option value="true" selected>允许（重买 = 起始筹码）</option>
            <option value="false">禁止（输光即出局）</option>
          </select>
        </label>
        <label>新玩家加入
          <select id="set-locked">
            <option value="false" selected>开放加入</option>
            <option value="true">锁定房间（原玩家仍可重连）</option>
          </select>
        </label>
        <p class="settings-tip">仅开局前可修改；还没开过局时，已入座玩家会按新筹码重置。</p>
        <div id="settings-error" class="error"></div>
        <div class="settings-actions">
          <button id="btn-settings-close" class="btn btn-secondary btn-small">取消</button>
          <button id="btn-settings-save" class="btn btn-primary btn-small">保存</button>
        </div>
      </div>
    </div>

    <!-- 结果弹窗（Phase 6 改牌桌直显，本轮保持可用） -->
    <div id="result-overlay" class="overlay hidden">
      <div id="result-card">
        <h2 id="result-title"></h2>
        <div id="result-pots"></div>
        <div id="session-box" class="hidden">
          <h3>本场战绩</h3>
          <table id="session-table">
            <thead>
              <tr><th>玩家</th><th>买入</th><th>筹码</th><th>盈亏</th><th>手数</th><th>胜场</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div id="next-tip"></div>
        <div class="result-actions">
          <button id="btn-result-close" class="btn btn-ghost btn-small">收起，看牌桌</button>
          <button id="btn-next-hand" class="btn btn-primary hidden">立即开始下一局</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 断线提示遮罩：自动重连（token 恢复座位），失败给出手动入口 -->
  <div id="conn-overlay" class="overlay hidden">
    <div class="conn-card">
      <div id="conn-msg">连接断开，正在重连…</div>
      <span id="conn-sub">恢复后会自动回到牌局</span>
      <div id="conn-actions" class="hidden">
        <button id="btn-reconnect" class="btn btn-primary btn-small">立即重连</button>
        <button id="btn-conn-lobby" class="btn btn-ghost btn-small">返回大厅</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
